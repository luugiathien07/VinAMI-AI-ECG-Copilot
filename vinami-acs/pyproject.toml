[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vinami-acs"
version = "0.1.0"
description = "VinAMI ACS Operating System research and engineering MVP scaffold"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "SQLAlchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.14,<2.0",
  "structlog>=24.4,<26.0",
  "prometheus-client>=0.21,<1.0",
  "redis>=5.2,<7.0",
  "streamlit>=1.40,<2.0",
  "httpx>=0.28,<1.0",
  "PyJWT[crypto]>=2.10,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "pydicom>=3.0,<4.0",
  "defusedxml>=0.7,<1.0",
  "numpy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.8,<1.0",
  "mypy>=1.13,<2.0",
  "pre-commit>=4.0,<5.0",
]
ecg-model = [
  "Pillow>=10.0,<12.0",
  "PyWavelets>=1.6,<2.0",
  "scipy>=1.13,<2.0",
  "timm>=1.0,<2.0",
  "torch>=2.3,<3.0",
  "torchvision>=0.18,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["vinami*"]

[tool.setuptools.package-data]
"vinami.workflow.definitions" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "apps", "tests", "scripts"]
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = [
  "src",
  "apps/api",
  "apps/worker",
  "apps/dashboard/main.py",
  "apps/dashboard/state/session.py",
  "scripts",
]
strict = true
warn_unused_configs = true
exclude = ["migrations"]

[[tool.mypy.overrides]]
module = [
  "defusedxml",
  "prometheus_client",
  "redis",
  "redis.*",
  "scipy",
  "scipy.*",
  "streamlit",
  "structlog",
  "timm",
  "torch",
  "torchvision",
]
ignore_missing_imports = true
